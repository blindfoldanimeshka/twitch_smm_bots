version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: twitch-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: twitch_bot_farm
      POSTGRES_USER: botfarm
      POSTGRES_PASSWORD: botfarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: twitch-bot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 10
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
