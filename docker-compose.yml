version: "3.9"

services:
  stt:
    build:
      context: ./stt_server
      dockerfile: Dockerfile
    container_name: twitch-bot-stt
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - STT_MODEL_NAME=${STT_MODEL_NAME:-small}
      - STT_DEVICE=${STT_DEVICE:-cpu}
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-int8}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: twitch-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: twitch_bot_farm
      POSTGRES_USER: botfarm
      POSTGRES_PASSWORD: botfarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botfarm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: twitch-bot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitch-bot-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TWITCH_CHANNEL=${TWITCH_CHANNEL}
      - API_KEY=${API_KEY:-secret-api-key-12345}
      - LLM_PROVIDER=${LLM_PROVIDER:-lmstudio}
      - LLM_API_URL=${LLM_API_URL:-http://host.docker.internal:1234/v1}
      - LLM_MODEL=${LLM_MODEL:-local-model}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DATABASE_URL=postgres://botfarm:botfarm@postgres:5432/twitch_bot_farm?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - API_PORT=8080
      - API_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - ENABLE_CONSOLE=false
      - AUDIO_STT_URL=${AUDIO_STT_URL:-http://stt:9000/v1/audio/transcriptions}
      - AUDIO_STT_MODEL=${AUDIO_STT_MODEL:-whisper-1}
      - AUDIO_STT_API_KEY=${AUDIO_STT_API_KEY:-}
      - AUDIO_STT_LANGUAGE=${AUDIO_STT_LANGUAGE:-ru}
      - AUDIO_CHUNK_SEC=${AUDIO_CHUNK_SEC:-8}
      - AUDIO_POLL_SEC=${AUDIO_POLL_SEC:-15}
      - AUDIO_CONTEXT_TTL_SEC=${AUDIO_CONTEXT_TTL_SEC:-120}
      - AUDIO_CONTEXT_MAX_CHARS=${AUDIO_CONTEXT_MAX_CHARS:-320}
      - AUDIO_STREAM_QUALITY=${AUDIO_STREAM_QUALITY:-best}
      - AUDIO_STREAMLINK_CMD=${AUDIO_STREAMLINK_CMD:-streamlink}
      - AUDIO_FFMPEG_CMD=${AUDIO_FFMPEG_CMD:-ffmpeg}
      - AUDIO_SOURCE_URL=${AUDIO_SOURCE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      stt:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twitch-bot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_WS_URL=ws://localhost:8080
      - VITE_API_KEY=${API_KEY:-secret-api-key-12345}

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: twitch-bot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 10
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
