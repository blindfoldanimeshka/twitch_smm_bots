name: twitch-smm

# BASE_IMAGE_PREFIX is only needed when Docker Hub is unreachable.
# Example for RU/CIS: BASE_IMAGE_PREFIX=mirror.yandex.ru/mirrors/docker/library/

services:
  postgres:
    image: ${BASE_IMAGE_PREFIX:-}postgres:16-alpine
    container_name: twitch-smm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: botfarm
      POSTGRES_USER: botfarm
      POSTGRES_PASSWORD: botfarm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botfarm -d botfarm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${BASE_IMAGE_PREFIX:-}redis:7-alpine
    container_name: twitch-smm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_PREFIX=${BASE_IMAGE_PREFIX:-}
    container_name: twitch-smm-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TWITCH_CHANNEL=${TWITCH_CHANNEL:-}
      - API_KEY=${API_KEY:-secret-api-key-12345}
      - API_PORT=8080
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - ENABLE_CONSOLE=false
      - DATABASE_URL=postgres://botfarm:botfarm@postgres:5432/botfarm?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LLM_API_URL=${LLM_API_URL:-https://openrouter.ai/api/v1}
      - LLM_MODEL=${LLM_MODEL:-openrouter/free}
      - LLM_PAID_MODEL=${LLM_PAID_MODEL:-z-ai/glm-5.3-flash}
      - LLM_PAID_ENABLED=${LLM_PAID_ENABLED:-}
      - LLM_PAID_DAILY_CAP_USD=${LLM_PAID_DAILY_CAP_USD:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-http://localhost:3000}
      - OPENROUTER_TITLE=${OPENROUTER_TITLE:-Twitch SMM Bot Farm}
      - TWITCH_OAUTH_TOKEN=${TWITCH_OAUTH_TOKEN:-}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - AUDIO_STT_URL=${AUDIO_STT_URL:-http://stt:9000/v1/audio/transcriptions}
      - AUDIO_STT_MODEL=${AUDIO_STT_MODEL:-whisper-1}
      - AUDIO_STT_API_KEY=${AUDIO_STT_API_KEY:-}
      - AUDIO_STT_LANGUAGE=${AUDIO_STT_LANGUAGE:-ru}
      - AUDIO_CHUNK_SEC=${AUDIO_CHUNK_SEC:-8}
      - AUDIO_POLL_SEC=${AUDIO_POLL_SEC:-15}
      - AUDIO_CONTEXT_TTL_SEC=${AUDIO_CONTEXT_TTL_SEC:-120}
      - AUDIO_CONTEXT_MAX_CHARS=${AUDIO_CONTEXT_MAX_CHARS:-320}
      - AUDIO_STREAM_QUALITY=${AUDIO_STREAM_QUALITY:-best}
      - AUDIO_STREAMLINK_CMD=${AUDIO_STREAMLINK_CMD:-streamlink}
      - AUDIO_FFMPEG_CMD=${AUDIO_FFMPEG_CMD:-ffmpeg}
      - AUDIO_SOURCE_URL=${AUDIO_SOURCE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE_PREFIX=${BASE_IMAGE_PREFIX:-}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8080}
        - VITE_API_KEY=${API_KEY:-secret-api-key-12345}
        - VITE_TEMP_MAIL_URL=${VITE_TEMP_MAIL_URL:-http://localhost:8090}
    container_name: twitch-smm-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: local stream audio transcription with whisper.cpp. Start with:
  #   docker compose --profile audio up -d
  # Requires models/ggml-small-q5_1.bin on the host.
  stt:
    profiles: ["audio"]
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: twitch-smm-stt
    restart: unless-stopped
    entrypoint: ["whisper-server"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "9000"
      - -m
      - /models/${STT_MODEL_FILE:-ggml-small-q5_1.bin}
      - -t
      - ${STT_THREADS:-4}
      - -l
      - ${STT_LANGUAGE:-ru}
      - --inference-path
      - /v1/audio/transcriptions
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Optional: database UI. Start with:
  #   docker compose --profile tools up -d
  pgadmin:
    profiles: ["tools"]
    image: ${BASE_IMAGE_PREFIX:-}dpage/pgadmin4:8
    container_name: twitch-smm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 10
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Self-hosted temporary mail (published GPL-3.0 image, run unmodified).
  # See docs/TEMPORARY_MAIL.md for Cloudflare Email Routing setup.
  tempfastmail:
    image: ${BASE_IMAGE_PREFIX:-}kasteckis/tempfastmail:latest
    container_name: twitch-smm-tempfastmail
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${TEMPFASTMAIL_APP_SECRET:-dev-only-change-me}
      DEFAULT_URI: ${TEMPFASTMAIL_URI:-http://localhost:8090}
      CREATE_RECEIVED_EMAIL_API_AUTHORIZATION_KEY: ${TEMPFASTMAIL_API_KEY:-dev-only-change-me}
      DELETE_EMAILS_AND_INBOXES_OLDER_THAN_HOURS: ${TEMPFASTMAIL_RETENTION_HOURS:-48}
    ports:
      - "${TEMPFASTMAIL_BIND:-127.0.0.1}:${TEMPFASTMAIL_PORT:-8090}:80"
    volumes:
      - tempfastmail_data:/app/sqlite

volumes:
  postgres_data:
  redis_data:
  tempfastmail_data:
